profile:
  id: nvidia-rtx5070ti
  version: 0.4.0
  status: not-yet-accepted
  description: NVIDIA GeForce RTX 5070 Ti Blackwell compute profile for hv-katra

os:
  family: ubuntu
  version: "24.04"

stack:
  kind: nvidia-cuda-modern

device:
  expected_vendor: NVIDIA
  expected_model: GeForce RTX 5070 Ti
  expected_pci_id: "10de:2c05"
  companion_audio_pci_id: "10de:22e9"
  expected_kernel_driver: nvidia
  compute_capability: "12.0"
  vram_gib: 16
  device_nodes:
    - /dev/nvidia0
    - /dev/nvidiactl
    - /dev/nvidia-uvm
    - /dev/nvidia-uvm-tools

cuda:
  pinned_version: "13.3"
  minimum_driver: "610.43.02"
  toolkit_package: cuda-toolkit-13-3
  toolkit_package_version: "13.3.1-1"
  driver_package: nvidia-open
  driver_branch: "610"
  kernel_module_flavor: open
  repository_distro: ubuntu2404
  repository_arch: x86_64
  repository_keyring_package: cuda-keyring_1.1-1_all.deb
  repository_keyring_sha256: f7f474b5f6a4adf987aa587920df00e713285958ef6a913dda1945a544a3099e

compute:
  production:
    - ollama
    - llama-cpp
  experimental:
    - vulkan-compute
  fallback_policy: reject

ollama:
  version: "0.32.0"
  release_tag: v0.32.0
  asset: ollama-linux-amd64.tar.zst
  asset_url: https://github.com/ollama/ollama/releases/download/v0.32.0/ollama-linux-amd64.tar.zst
  asset_sha256: 56362d7609dfa9e35aaebb7c9cab25605d8f0528ec3d5d585dc83d6642002bab
  models_path: /mnt/models/library
  host: "127.0.0.1:11434"

llama_cpp:
  ref: b10173
  commit: e9fa0781f1c25fc4fe8c86be1edc6970661ad6f0
  repository: https://github.com/ggml-org/llama.cpp.git
  cuda_architectures: "120"
  install_prefix: /usr/local

storage:
  models_mount: /mnt/models
  models_source: deployment-required
  min_free_gib: 20
  min_free_percent: 20

required_tests:
  - smoke/appliance
  - smoke/cuda-nvidia
  - acceptance/appliance
